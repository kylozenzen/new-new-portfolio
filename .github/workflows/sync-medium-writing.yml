name: Sync Medium writing

on:
  push:
    branches:
      - main
    paths-ignore:
      - writing.json
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-medium-writing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull latest Medium stories
        run: node scripts/update-medium-writing.mjs

      - name: Commit changes when the feed changed
        shell: bash
        run: |
          if git diff --quiet -- writing.json; then
            echo "Medium writing is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.json
          git commit -m "Sync latest Medium writing"
          git push
